# ============================================================
# 光明记忆（LIMS）规模档位配置 —— Linux 版
# 档位：Solo（个人）/ 平台：Linux
# 对应主文档版本：lightmem.md v2.0（§2.6 可缩放模式）
# 目标用户：单个开发者 / 爱好者，Linux 工作站或单台 VPS
# 用户量级：1 人 | 记忆量级：万级 | 部署形态：单机自包含
# 适用发行版：Ubuntu 24.04 / Debian 12 / Rocky 9（x86_64 / arm64）
# 配套手册：manuals/linux-setup.md
# 配套清单：checklists/linux-security-checklist.md
# ============================================================
#
# 【与 FreeBSD 档位的差异（只讲差异，其余逐字段对齐 lims-solo.profile.yaml）】
#   1) 无 jail：Linux 侧进程隔离由 systemd 沙箱（NoNewPrivileges / ProtectSystem /
#      PrivateTmp 等，见 deploy/lightmem.service）承担，故 security 段的 jail 开关置假。
#   2) 无 ZFS：数据落在普通文件系统（ext4 / xfs）的 /opt/lightmem/data 下，
#      静态加密由 LUKS / fscrypt 在块层或目录层完成（见安全清单第 4 节）。
#   3) 路径：FreeBSD 用相对路径 ./data/*，Linux 按 FHS 固定到 /opt/lightmem/data。
#   4) 端口：systemd 口径 7443（API）/ 7444（MCP），与 FreeBSD rc.d 的
#      18443 / 18444 **不得混用**（口径真源：deploy/lightmem.service 注释）。
#
# 【关于 platform 字段】
#   profiles/lims.profile.schema.json 是 draft-07 且顶层 additionalProperties: false，
#   其 properties 中**没有** platform；kernel/profile.go 的 yaml.Unmarshal 也不认它。
#   因此本档位**不新增** platform 字段（加了只会让严格校验器报错、内核仍读不到），
#   平台信息只用本注释块与下方 security 段的 jail 开关表达。详见本次交付 summary。
# ============================================================

# 档位标识（schema enum 只认 solo/family/smb/enterprise；Linux 是平台维度，不是档位维度）
profile: solo

# ---------- 存储后端 ----------
# 可选：sqlite | pgvector | qdrant | pgvector+shard
# Linux Solo 与 FreeBSD Solo 同为真·持久化 SQLite（纯 Go 驱动 modernc.org/sqlite，无 cgo，
# 故交叉编译到 linux/amd64、linux/arm64 均无需系统 sqlite3 库）。
storage_backend: sqlite

storage:
  sqlite:
    # 数据库文件绝对路径（systemd 单元里 ProtectSystem=strict，只有
    # ReadWritePaths=/opt/lightmem/data 与 /opt/lightmem/logs 可写，
    # 所以库文件必须落在这两个目录之一，否则服务起不来）。
    path: /opt/lightmem/data/lims.sqlite
    # 向量扩展占位：与 FreeBSD Solo 同口径，sqlite-vec 尚未接入，
    # VectorSearch 仍降级为文本检索（调度层 fail-open），此字段不构成能力承诺。
    vector_extension: sqlite-vec
    # WAL 模式：单用户低并发建议开启，崩溃恢复更稳
    wal_mode: true
    # 外键与 schema 校验
    fk_enabled: true
    # ---- 耐久显式化（与 FreeBSD Solo 一致，理由见 lims-solo.profile.yaml）----
    # full = 提交即落盘；禁止「悄悄用 normal 却宣称不丢」。
    synchronous: full
    # 等锁上限（毫秒）
    busy_timeout_ms: 5000
    # WAL 自动检查点阈值（页）
    wal_autocheckpoint: 1000
    # 关闭时 wal_checkpoint(TRUNCATE)，把 WAL 归零
    checkpoint_on_close: true
  # L3 归档：个人场景用本地目录即可（ext4/xfs 普通目录，非 ZFS dataset）
  archive:
    backend: local
    path: /opt/lightmem/data/archive/
  # 向量维度（与 Embedding 模型对齐）
  embedding:
    model: BGE-small-zh
    dimensions: 512
    # 个人场景 CPU 推理即可
    device: cpu

# ---------- 缓存 ----------
# 可选：none | redis | redis-cluster
cache: none

# ---------- 消息队列 ----------
# 可选：none | redis | rabbitmq | kafka
mq: none

# ---------- 网络 ----------
network:
  # 单机模式，仅本机访问（对外发布请按手册第 11 节挂 TLS 反向代理）
  bind: 127.0.0.1
  # systemd 口径：7443（kernel/REST）。MCP 用 7444，由另一个 unit 监听。
  api_port: 7443
  # pf 是 FreeBSD 的包过滤器；Linux 侧用 ufw / firewalld / nftables（见手册第 10 节）。
  # 此段保留 enabled: false 只是为了与既有 schema 字段对齐，并不表示 Linux 上装了 pf。
  pf:
    enabled: false

# ---------- 安全组件 ----------
# Solo 仅保留"必须"的 OS 层加固，其余按需
security:
  # 进程隔离：Linux 无 jail；改用 systemd 沙箱（deploy/lightmem.service 已内置）。
  # 这是本档位与 FreeBSD 语义差异的**唯一硬标志位**，也是验收 grep 的锚点。
  jail: false
  # ZFS 加密：Linux 无 ZFS；静态加密走 LUKS（块层）或 fscrypt（目录层）
  zfs_encryption: false
  # 强制访问控制：单用户无需（Linux 上对应 AppArmor / SELinux，按发行版默认即可）
  mac: false
  # 文件系统 ACL：按需（Linux 侧是 POSIX ACL，setfacl/getfacl 语义与 FreeBSD 不同）
  acl: false
  # 网络 IPsec：单机无需
  ipsec: false
  # 漏洞审计：保持 true（Linux 对应 apt/dnf 的安全更新源 + unattended-upgrades/dnf-automatic）
  pkg_audit: true
  # 系统审计：保持 true（Linux 对应 auditd + journald）
  process_accounting: true
  # 最小权限：建议保持（专用 lightmem 系统用户 + systemd 沙箱）
  minimal_privilege: true
  # TLS 终结：单机可用自签或本地证书
  tls: self_signed
  # 密钥管理：本地 keyring + EnvironmentFile（0600）文件权限
  key_management: local_keyring

# ---------- 功能开关 ----------
# 注意：poison_guard / audit / delete_rights 在所有档位必须为 true
features:
  # 投毒防护（§7.5）—— 不可裁剪
  poison_guard: true
  # 审计（§7.2）—— 不可裁剪
  audit: true
  # 删除权级联（§7.3）—— 不可裁剪
  delete_rights: true
  # 核心记忆块（§3.7）：个人场景开启价值高
  core_memory: true
  # 后台整合（§3.13）：个人场景可关（数据量小）
  consolidation: false
  # 多信号检索（§3.4）：SQLite 只保留语义+关键词，实体信号关闭
  multi_signal_retrieval: false
  # 反馈闭环（§3.11）：建议开启
  feedback_loop: true
  # 目标记忆（§3.8）：个人场景开启
  goal_memory: true
  # 外部连接器（§3.12）：个人场景可选
  external_connectors: false

# ---------- 扩容参数 ----------
# Solo 无扩容，预留字段便于后续升档
scaling:
  mode: standalone
  # 单机自包含，无节点角色
  nodes: 1
  # Linux Solo → Linux Family（PG + pgvector）不影响数据契约，按手册第 14 节迁移
  upgrade_path: family
# ---------- Agent 鉴权（与 FreeBSD 档位同口径） ----------
# 每个 Agent 一份 token，服务端按 token 定身份，杜绝 body 冒充（G4 修法）。
# 默认 agent_tokens 为空 → 透传；env LIMS_AGENT_TOKENS 优先于本段；
# require_auth: true 或 env LIMS_REQUIRE_AUTH=1 强制 401。
# ⚠️ token 是凭证：勿提交真实 token；示例一律注释。Linux 上落在
#    /opt/lightmem/lightmem.env（install -m 600，属主 root:lightmem）。
auth:
  # require_auth: false
  agent_tokens: {}
  # agent_tokens:
  #   "t-solo-...": {agent_id: duan, user_id: skywalk, tenant_id: soloteam}
