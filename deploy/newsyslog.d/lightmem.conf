# R29-T0 P0-A：lightmem 日志轮转（对应 L-257）
#
# newsyslog.conf(5) 字段顺序：
#   logfile  owner:group  mode  count  size  when  [flags]  [pidfile]  [signal]
#   - count=7 ：保留 7 份（按日切，≈保留一周）
#   - size=*  ：不按大小切，仅按时间
#   - when=@T00 ：每日 00:00 轮转
#   - flags=Z ：轮转后 gzip 压缩旧档（若 newsyslog 支持）
#   - pidfile/signal 省略：lightmem 自己管理文件句柄，由 daemon -H 配合 reopen；
#     若进程不重开日志，可改为发 SIGUSR1（需服务支持），此处留空以保守。
/var/log/lightmem.log        lightmem:lightmem   644  7  *  @T00  Z
/var/log/lightmem-mcp.log    lightmem:lightmem   644  7  *  @T00  Z
